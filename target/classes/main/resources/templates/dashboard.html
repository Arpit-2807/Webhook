<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Payment Webhook Dashboard</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<!-- Header -->
<div class="header">
    <h1>Payment Webhook Dashboard</h1>
    <a href="/webhook/test" class="btn-test">
        Trigger Test Payment
    </a>
</div>

<!-- Stats Cards -->
<div class="stats-container">

    <div class="card total">
        <h2>Total Payments</h2>
        <p class="count" th:text="${totalCount}">0</p>
    </div>

    <div class="card success">
        <h2>Successful</h2>
        <p class="count" th:text="${successCount}">0</p>
    </div>

    <div class="card failed">
        <h2>Failed</h2>
        <p class="count" th:text="${failedCount}">0</p>
    </div>

</div>

<!-- Payment Events Table -->
<div class="table-container">
    <h2>Recent Payment Events</h2>

    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>Event Type</th>
            <th>Payment ID</th>
            <th>Amount</th>
            <th>Currency</th>
            <th>Status</th>
            <th>Time</th>
        </tr>
        </thead>
        <tbody>
        <!-- Loop through all events -->
        <tr th:each="event : ${events}">
            <td th:text="${event.id}">1</td>
            <td th:text="${event.eventType}">type</td>
            <td th:text="${event.paymentId}">id</td>
            <td th:text="${event.amount}">0.0</td>
            <td th:text="${event.currency}">INR</td>
            <td>
                        <span th:text="${event.status}"
                              th:class="${event.status == 'success'}
                              ? 'badge-success' : 'badge-failed'">
                            status
                        </span>
            </td>
            <td th:text="${event.createdAt}">time</td>
        </tr>

        <!-- Show message if no events -->
        <tr th:if="${#lists.isEmpty(events)}">
            <td colspan="7" class="no-data">
                No payment events yet.
                Click "Trigger Test Payment" to test!
            </td>
        </tr>
        </tbody>
    </table>
</div>

<div class="footer">
    <a href="/logs">View Webhook Logs</a>
</div>

</body>
</html>
